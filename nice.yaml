apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ss
  template:
    metadata:
      labels:
        app: ss
    spec:
      containers:
        - name: ss-server
          image: ss:1.0
          ports:
            - containerPort: 8081
          imagePullPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: ss-service
spec:
  type: NodePort
  selector:
    app: ss
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 31321