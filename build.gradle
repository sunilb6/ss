plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.0'
	id 'io.spring.dependency-management' version '1.1.0'
}

group = 'com.example'
version = '1.0'
sourceCompatibility = '17'

repositories {
	mavenCentral()
}

bootJar {
	archiveBaseName.set("ss")
	archiveVersion.set("2.0")
	archiveFileName.set("ss-2.0.jar")
}


dependencies {
	compileOnly 'org.projectlombok:lombok:1.18.28'

	implementation 'org.json:json:20230618'

	implementation 'io.jsonwebtoken:jjwt-gson:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'



	implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-params:5.8.1'

//	testImplementation 'org.junit.jupiter:junit-jupiter-api'
//	testImplementation 'org.junit.jupiter:junit-jupiter-engine'
//	testImplementation 'org.junit.jupiter:junit-jupiter-param'

//			<groupId>org.junit.jupiter</groupId>
//        <artifactId>junit-jupiter-api</artifactId>
//	<version>5.9.2</version>


	//	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	// Spring Data REST will scan for JpaRepository and expose end points so i get this
	// end points fpr free, based on the various entity types in ur JpaRepository
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
	useJUnitPlatform()
}
