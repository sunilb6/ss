plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.0'
	id 'io.spring.dependency-management' version '1.1.0'
}

group = 'com.example'
version = '1.0'
sourceCompatibility = '17'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.projectlombok:lombok:1.18.22'

	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb:3.1.0'

	//implementation 'org.springframework.data:spring-data-mongodb:4.1.1'

	//implementation 'org.mongodb:mongodb-driver-sync:4.9.1'
	//implementation 'org.mongodb:bson:4.9.1'
	//implementation 'org.mongodb:mongodb-driver-core:4.9.1'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
