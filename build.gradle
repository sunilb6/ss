plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.0'
	id 'io.spring.dependency-management' version '1.1.0'
}

group = 'com.example'
version = '1.0'
sourceCompatibility = '17'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok:1.18.28'


	//implementation 'org.springframework.boot:spring-boot-starter-data-mongodb:3.1.0'
	implementation 'org.json:json:20230618'

	implementation 'io.jsonwebtoken:jjwt-gson:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'

	implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'


	//implementation 'org.springframework.data:spring-data-mongodb:4.1.1'

	//implementation 'org.mongodb:mongodb-driver-sync:4.9.1'
	//implementation 'org.mongodb:bson:4.9.1'
	//implementation 'org.mongodb:mongodb-driver-core:4.9.1'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
//	implementation 'org.springframework.boot:spring-boot-starter-actuator'
//	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
	useJUnitPlatform()
}
